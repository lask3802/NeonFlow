<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Neon Flow</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000000;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      canvas {
        display: block;
      }

      #hud {
        position: fixed;
        top: 20px;
        left: 20px;
        color: #ffffff;
        font-size: 14px;
        letter-spacing: 2px;
        text-shadow: 0 0 12px rgba(0, 255, 255, 0.7);
        z-index: 10;
      }

      #hud .value {
        font-size: 28px;
        margin-bottom: 12px;
      }
    </style>
  </head>
  <body>
    <div id="hud">
      <div>SCORE</div>
      <div id="score" class="value">0</div>
      <div>COMBO</div>
      <div id="combo" class="value">0</div>
    </div>

    <script type="module">
      import * as THREE from "./three.module.js";

      const scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(0x05000f, 0.035);

      const camera = new THREE.PerspectiveCamera(
        75,
        window.innerWidth / window.innerHeight,
        0.1,
        2000
      );

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      document.body.appendChild(renderer.domElement);

      scene.add(camera);

      const ambient = new THREE.AmbientLight(0xffffff, 1.2);
      scene.add(ambient);

      const tunnelPoints = [];
      const segmentLength = 18;
      const pointCount = 220;
      for (let i = 0; i < pointCount; i += 1) {
        tunnelPoints.push(
          new THREE.Vector3(
            (Math.random() - 0.5) * 24,
            (Math.random() - 0.5) * 24,
            -i * segmentLength
          )
        );
      }

      const curve = new THREE.CatmullRomCurve3(tunnelPoints);
      const tubularSegments = 2200;
      const curveLength = curve.getLength();
      const frames = curve.computeFrenetFrames(tubularSegments, false);

      const tunnelGeometry = new THREE.TubeGeometry(
        curve,
        tubularSegments,
        5,
        16,
        false
      );
      const tunnelMaterial = new THREE.MeshBasicMaterial({
        color: 0x00ffff,
        wireframe: true,
        transparent: true,
        opacity: 0.4,
      });
      const tunnel = new THREE.Mesh(tunnelGeometry, tunnelMaterial);
      scene.add(tunnel);

      const playerGroup = new THREE.Group();
      const playerMaterial = new THREE.MeshBasicMaterial({ color: 0xffffff });
      const playerMesh = new THREE.Mesh(
        new THREE.SphereGeometry(0.4, 32, 32),
        playerMaterial
      );
      playerGroup.add(playerMesh);

      const trailMaterial = new THREE.MeshBasicMaterial({
        color: 0x00ffff,
        transparent: true,
        opacity: 0.5,
      });
      const trailGeometry = new THREE.CylinderGeometry(0.08, 0.25, 3, 10, 1, true);
      trailGeometry.rotateX(Math.PI / 2);
      const trailMesh = new THREE.Mesh(trailGeometry, trailMaterial);
      trailMesh.position.z = -1.6;
      playerGroup.add(trailMesh);
      scene.add(playerGroup);

      const starCount = 500;
      const starDepth = 220;
      const starRadius = 20;
      const starPositions = new Float32Array(starCount * 3);
      for (let i = 0; i < starCount; i += 1) {
        const i3 = i * 3;
        starPositions[i3] = (Math.random() - 0.5) * starRadius * 2;
        starPositions[i3 + 1] = (Math.random() - 0.5) * starRadius * 2;
        starPositions[i3 + 2] = -Math.random() * starDepth;
      }
      const starGeometry = new THREE.BufferGeometry();
      starGeometry.setAttribute(
        "position",
        new THREE.BufferAttribute(starPositions, 3)
      );
      const starMaterial = new THREE.PointsMaterial({
        color: 0xffffff,
        size: 0.3,
        transparent: true,
        opacity: 0.8,
      });
      const stars = new THREE.Points(starGeometry, starMaterial);
      camera.add(stars);

      const scoreEl = document.getElementById("score");
      const comboEl = document.getElementById("combo");

      const targetInput = new THREE.Vector2();
      const smoothedInput = new THREE.Vector2();
      const maxOffset = 2.4;

      const handlePointer = (clientX, clientY) => {
        const x = (clientX / window.innerWidth) * 2 - 1;
        const y = -(clientY / window.innerHeight) * 2 + 1;
        targetInput.set(x, y);
      };

      window.addEventListener("mousemove", (event) => {
        handlePointer(event.clientX, event.clientY);
      });

      window.addEventListener(
        "touchmove",
        (event) => {
          if (event.touches.length > 0) {
            handlePointer(event.touches[0].clientX, event.touches[0].clientY);
          }
        },
        { passive: true }
      );

      let progress = 0;
      let score = 0;
      let combo = 0;
      let comboTimer = 0;
      const clock = new THREE.Clock();
      const smoothedUp = new THREE.Vector3(0, 1, 0);

      const perfectThreshold = 0.6;
      const goodThreshold = 1.6;
      const cameraDistance = 8;
      const lookAheadDistance = 50;
      const playerForward = 4;
      const baseFov = 75;
      const speed = 0.035;
      const maxDelta = 0.05; // Prevent large jumps after tab inactivity.
      const inputSmoothing = 0.08;
      const fovSmoothing = 0.08;
      const comboStep = 0.15;

      const updateStars = (delta) => {
        if (delta <= 0) {
          return;
        }
        const positions = starGeometry.attributes.position.array;
        for (let i = 0; i < starCount; i += 1) {
          const i3 = i * 3;
          positions[i3 + 2] += delta * 60;
          if (positions[i3 + 2] > 2) {
            positions[i3 + 2] = -starDepth;
          }
        }
        starGeometry.attributes.position.needsUpdate = true;
      };

      const animate = () => {
        const delta = Math.min(clock.getDelta(), maxDelta);
        progress = (progress + speed * delta) % 1;

        const frameIndex = Math.min(
          frames.tangents.length - 1,
          Math.floor(progress * tubularSegments)
        );
        const position = curve.getPointAt(progress);
        const tangent = frames.tangents[frameIndex].clone();
        const normal = frames.normals[frameIndex].clone();
        const binormal = frames.binormals[frameIndex].clone();

        const lookAheadT =
          (progress + lookAheadDistance / curveLength) % 1;
        const lookAhead = curve.getPointAt(lookAheadT);

        smoothedInput.lerp(targetInput, inputSmoothing);
        const offset = smoothedInput.clone().multiplyScalar(maxOffset);
        const distanceFromCenter = offset.length();

        let targetFov = baseFov;
        let tunnelOpacity = 0.4;
        let tunnelColor = 0x00ffff;
        let trailScale = 1;
        let trailOpacity = 0.5;
        let shakeIntensity = 0;

        if (distanceFromCenter < perfectThreshold) {
          playerMaterial.color.setHex(0xffffff);
          tunnelColor = 0xffffff;
          tunnelOpacity = 0.7;
          trailScale = 2.1;
          trailOpacity = 0.8;
          targetFov = 90;
          score += 600 * delta;
          comboTimer += delta;
          if (comboTimer >= comboStep) {
            const comboSteps = Math.floor(comboTimer / comboStep);
            combo += comboSteps;
            comboTimer -= comboSteps * comboStep;
          }
        } else if (distanceFromCenter < goodThreshold) {
          playerMaterial.color.setHex(0xffcc66);
          tunnelOpacity = 0.5;
          tunnelColor = 0x00ffff;
          trailScale = 1.3;
          trailOpacity = 0.55;
          targetFov = 78;
          score += 120 * delta;
          comboTimer = 0;
        } else {
          playerMaterial.color.setHex(0xff3344);
          tunnelOpacity = 0.3;
          tunnelColor = 0x8844ff;
          trailScale = 0.9;
          trailOpacity = 0.3;
          combo = 0;
          comboTimer = 0;
          shakeIntensity = 0.12;
        }

        tunnelMaterial.color.setHex(tunnelColor);
        tunnelMaterial.opacity = tunnelOpacity;
        trailMesh.scale.set(1, 1, trailScale);
        trailMaterial.opacity = trailOpacity;

        if (Math.abs(camera.fov - targetFov) > 0.01) {
          camera.fov = THREE.MathUtils.lerp(camera.fov, targetFov, fovSmoothing);
          camera.updateProjectionMatrix();
        }

        const cameraPosition = position
          .clone()
          .add(tangent.clone().multiplyScalar(-cameraDistance));
        if (shakeIntensity > 0) {
          cameraPosition.add(
            normal.clone().multiplyScalar((Math.random() - 0.5) * shakeIntensity)
          );
          cameraPosition.add(
            binormal
              .clone()
              .multiplyScalar((Math.random() - 0.5) * shakeIntensity)
          );
        }
        camera.position.copy(cameraPosition);

        smoothedUp.lerp(binormal, 0.05).normalize();
        camera.up.copy(smoothedUp);
        camera.lookAt(lookAhead);

        const playerPosition = position
          .clone()
          .add(tangent.clone().multiplyScalar(playerForward))
          .add(normal.clone().multiplyScalar(offset.x))
          .add(binormal.clone().multiplyScalar(offset.y));
        playerGroup.position.copy(playerPosition);
        playerGroup.quaternion.copy(camera.quaternion);

        updateStars(delta);

        scoreEl.textContent = Math.floor(score).toString();
        comboEl.textContent = combo.toString();

        renderer.render(scene, camera);
        requestAnimationFrame(animate);
      };

      animate();

      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    </script>
  </body>
</html>

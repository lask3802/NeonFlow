<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Neon Flow</title>
    <link rel="stylesheet" href="./styles/main.css" />
  </head>
  <body>
    <div id="hud" class="is-hidden">
      <div>SCORE</div>
      <div id="score" class="value">0</div>
      <div>COMBO</div>
      <div id="combo" class="value">0</div>
      <div id="speed-control">
        <label for="speed">SPEED</label>
        <input
          id="speed"
          type="range"
          min="0.001"
          max="0.02"
          step="0.001"
          aria-label="Speed"
          aria-valuemin="0.001"
          aria-valuemax="0.02"
          aria-describedby="speed-hint"
        />
        <div id="speed-value"></div>
        <div id="speed-hint">TUNNEL SPEED</div>
      </div>
      <div id="combo-goal">GOAL 500 COMBO</div>
    </div>

    <div id="focus-hud" class="is-hidden">
      <div id="judgement">READY</div>
      <div id="focus-combo" class="combo">x0</div>
    </div>

    <div id="start-screen" class="screen visible">
      <div class="panel">
        <div class="title">NEON FLOW</div>
        <div class="subtitle">KEEP PERFECT TO PUSH SPEED</div>
        <button id="start-button">START</button>
      </div>
    </div>

    <div id="summary-screen" class="screen">
      <div class="panel">
        <div class="title">RESULT</div>
        <div class="subtitle">500 COMBO RUN COMPLETE</div>
        <div class="summary-grid">
          <div class="label">SCORE</div>
          <div id="final-score">0</div>
          <div class="label">MAX COMBO</div>
          <div id="final-combo">0</div>
          <div class="label">FINAL SPEED</div>
          <div id="final-speed">0.000</div>
        </div>
        <button id="restart-button">PLAY AGAIN</button>
      </div>
    </div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
